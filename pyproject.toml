[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ralph-whisper"
version = "0.1.0"
description = "Cross-platform push-to-talk voice dictation using faster-whisper"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["faster-whisper>=1.2", "numpy"]

[project.optional-dependencies]
# desktop backends (macOS / Windows): audio + hotkey + clipboard
desktop = ["sounddevice", "pynput", "pyperclip"]
# GPU runtime libs (NVIDIA CUDA 12; driver installed separately)
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]

[project.scripts]
ralph-whisper = "ralph_whisper.__main__:_run"

[tool.setuptools]
packages = ["ralph_whisper", "ralph_whisper.backends"]
